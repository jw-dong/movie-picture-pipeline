name: Backend CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: backend
  EKS_CLUSTER_NAME: movie-picture-pipeline
  WORKING_DIR: starter/backend
  K8S_DIR: starter/backend/k8s

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: ${{env.WORKING_DIR}}/Pipfile.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install flake8

      - name: Run lint
        run: npm run lint


  test: 
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: ${{env.WORKING_DIR}}/Pipfile.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install flake8
          pip install pytest
          pip install flask
          pip install flask_cors

      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}

    outputs:
      image-uri: ${{steps.image.outputs.image-uri}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}} 

      - name: Log in AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Define image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push backend Docker image
        run: |
          docker push "$IMAGE_URI"

      - name: Configure Kubectl
        run: aws eks update-kubeconfig --name "${{env.EKS_CLUSTER_NAME}}" --region "${{env.AWS_REGION}}"


  deploy:
    runs-on: ubuntu-latest

    needs:
      - build

    defaults:
      run:
        working-directory: ${{env.K8S_DIR}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}} 
      
      - name: Deploy to Kubernetes
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: frontend
          IMAGE_TAG: ${{github.sha}}
          KUBE_CONFIG: ${{secrets.KUBECONFIG}}
          K8_DIR: starter/backend/k8s
        run: |
          aws eks update-kubeconfig --name "${{env.EKS_CLUSTER_NAME}}" --region "${{env.AWS_REGION}}"

      - name: Deploy backend to Kubernetes
        env:
          IMAGE_URI: ${{needs.build.outputs.image-uri}}
        run: |
          kustomize edit set image backend="$IMAGE_URI"
          kustomize build . | kubectl apply -f -

      - name: Display URLs
        env:
          K8_DIR: starter/backend/k8s
        run: |
          cd ${{K8_DIR}}
          kubectl get svc -A
