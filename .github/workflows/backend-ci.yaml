name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO:
  REACT_API_URL:
  WORKING_DIR: starter/backend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ${{env.WORKING_DIR}}
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install flake8

      - name: Run lint
        run: cd ${{env.WORKING_DIR}} && pipenv run lint


  test: 
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ${{env.WORKING_DIR}}
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install flake8
          pip install pytest
          pip install flask
          pip install flask_cors

      - name: Run Test
        run: cd ${{env.WORKING_DIR}} && pipenv run test

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}} 

      - name: Log in AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build backend Docket image
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: ${{env.ECR_REPO}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build --tag=$REGISTRY/$REPOSITORY:$IMAGE_TAG .