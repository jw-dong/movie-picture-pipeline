name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: frontend
  REACT_API_URL:
  WORKING_DIR: starter/frontend

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js environment setup
        uses: actions/setup-node@v4
        with:
          node-verison: latest
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  test: 
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js environment setup
        uses: actions/setup-node@v4
        with:
          node-verison: latest
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js environment setup
        uses: actions/setup-node@v4
        with:
          node-verison: latest
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}} 

      - name: Log in AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build frontend Docket image
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: ${{env.ECR_REPO}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          cd ${{WORKING_DIR}} 
          docker build --build-arg REACT_APP_MOVIE_APT_URL=${{env.REACT_API_URL}} -t $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Configure Kubectl
        run: aws eks update-kubeconfig --name moive-picture-pipeline --region us-east-1


  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend/k8s

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}} 
      
      - name: Deploy to Kubernetes
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: frontend
          IMAGE_TAG: ${{github.sha}}
          KUBE_CONFIG: ${{secrets.KUBECONFIG}}
          K8_DIR: starter/frontend/k8s
        run: |
          cd ${{K8_DIR}}
          aws eks update-kubeconfig --name moive-picture-pipeline --region us-east-1
          kustomize edit set image frontend=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -

      - name: Display URLs
        env:
          K8_DIR: starter/frontend/k8s
        run: |
          cd ${{K8_DIR}}
          kubectl get svc -A